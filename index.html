<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4B • Plan lekcji</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}header{padding:48px 20px 28px;text-align:center;background:linear-gradient(135deg,#6c63ff,#8b5cf6);color:white}h1{margin:0;font-size:clamp(32px,7vw,58px);letter-spacing:-2px}header p{margin:10px 0 0;opacity:.9;font-size:16px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.schedule{display:grid;gap:14px}.day{background:white;border:1px solid #e8ebf2;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(25,35,60,.06)}.day h2{margin:0 0 14px;font-size:20px}.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.lesson{padding:13px;border-radius:14px;background:#f6f7ff}.num{font-size:12px;color:#7b8192;font-weight:700}.subject{margin-top:4px;font-weight:700}.time{font-size:12px;color:#656b7a;margin-top:4px}.special{background:#ede9fe}.footer{text-align:center;color:#8a90a0;font-size:12px;padding:30px}.empty{opacity:.35}.today{outline:2px solid #8b5cf6}
</style>
</head>
<body>
<header><h1>4B</h1><p>Plan lekcji • szybki podgląd dla klasy</p></header>
<main class="wrap"><section class="schedule" id="schedule"></section><div class="footer">Miłego dnia! ✨</div></main>
<script>
const times=['8:00–8:45','8:50–9:35','9:45–10:30','10:40–11:25','11:40–12:25','12:45–13:30','13:45–14:30','14:35–15:20'];
const days=[
 ['Poniedziałek',['','j. polski','j. polski','przyroda','EZ','matematyka','','']],
 ['Wtorek',['','j. hiszp.','WF','','historia','j. ang.','','etyka']],
 ['Środa',['plastyka','j. polski','muzyka','godz. wych.','matematyka','WF','religia','']],
 ['Czwartek',['przyroda','','j. polski','j. hiszp.','matematyka','j. ang.','WF','']],
 ['Piątek',['matematyka','ZPT','','j. polski','j. ang.','informatyka','','']]
];
const root=document.getElementById('schedule');
days.forEach(([day,items])=>{const el=document.createElement('article');el.className='day';el.innerHTML=`<h2>${day}</h2><div class="lessons">${items.map((s,i)=>`<div class="lesson ${s==='EZ'||s==='ZPT'?'special':''} ${!s?'empty':''}"><div class="num">${i+1}. lekcja</div><div class="subject">${s||'—'}</div><div class="time">${times[i]}</div></div>`).join('')}</div>`;root.appendChild(el)});
</script>
</body>
</html>
